<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>QuotaHush</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 300px;
    margin: 0;
    padding: 12px;
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    font-size: 13px;
    background: #1e1e1e;
    color: #eee;
  }
  h2 {
    font-size: 13px;
    margin: 14px 0 6px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: #9a9a9a;
  }
  h2:first-child { margin-top: 0; }
  h2.provider-title {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .provider-icon {
    width: 16px;
    height: 16px;
    flex: 0 0 16px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .row.spaced { margin-top: 8px; }
  .spaced { margin-top: 10px; }
  .label { color: #bbb; }
  .value { font-variant-numeric: tabular-nums; }
  .credits {
    margin-top: 10px;
    padding: 8px 9px;
    border: 1px solid #383838;
    border-radius: 6px;
    background: #262626;
  }
  .credits-title {
    margin-bottom: 5px;
    color: #ddd;
    font-weight: 600;
  }
  .credit-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 3px;
  }
  .credit-row .value {
    text-align: right;
    white-space: nowrap;
  }
  .credit-row .value.wrap { white-space: normal; }
  .credit-row.section-gap { margin-top: 8px; }
  .bundle-name { margin: 5px 0; font-size: 11px; color: #999; }
  .bundle-name.section-gap { margin-top: 12px; }
  .bar {
    height: 6px;
    background: #3a3a3a;
    border-radius: 3px;
    overflow: hidden;
    margin: 4px 0 10px;
  }
  .bar-fill {
    height: 100%;
    background: #4c9aff;
    transition: width .3s ease;
  }
  .bar-fill.warn { background: #e0a300; }
  .bar-fill.crit { background: #e05555; }
  .error {
    color: #e05555;
    font-size: 12px;
  }
  .stale {
    margin: -2px 0 8px;
    color: #e0a300;
    font-size: 11px;
  }
  .meta {
    margin-top: 12px;
    font-size: 11px;
    color: #777;
    text-align: right;
  }
  .offline {
    color: #e05555;
    font-size: 12px;
    line-height: 1.4;
  }
  .install-button {
    display: inline-block;
    margin-top: 12px;
    padding: 7px 10px;
    border-radius: 5px;
    background: #2878d0;
    color: #fff;
    font-weight: 600;
    text-decoration: none;
  }
  .install-button:hover { background: #3489e5; }
</style>
</head>
<body>
  <div id="content">Loading...</div>
  <div class="meta" id="meta"></div>
  <script src="usage-shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
