name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  windows-companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build standalone companion
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller server/quotahush-server.spec --distpath build/windows --workpath build/pyinstaller
      - name: Build Windows installer
        shell: pwsh
        run: |
          $Version = (Get-Content VERSION -Raw).Trim()
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/generate-icons.ps1
          git diff --exit-code -- installer/windows/quotahush.ico extension/icons vscode-extension/media/icon.png docs/assets/icon.png
          $Iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $Iscc) {
            $Candidates = @(
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            )
            $Iscc = $Candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $Iscc) {
            throw "Inno Setup compiler was not found on the runner."
          }
          $Companion = (Resolve-Path build/windows/quotahush-server.exe).Path
          $Output = (Resolve-Path build).Path
          & $Iscc "/DAppVersion=$Version" "/DCompanionExe=$Companion" "/DOutputDir=$Output" installer/windows/quotahush.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }
      - name: Assemble installer archive
        shell: pwsh
        run: |
          $Version = (Get-Content VERSION -Raw).Trim()
          $Stage = "build/QuotaHush-Windows-x64"
          New-Item -ItemType Directory -Path $Stage | Out-Null
          Copy-Item build/windows/quotahush-server.exe $Stage/
          Copy-Item installer/windows/install.ps1 $Stage/
          Copy-Item installer/windows/uninstall.ps1 $Stage/
          Copy-Item .var.env.example $Stage/
          Copy-Item LICENSE $Stage/
          Copy-Item PRIVACY.md $Stage/
          Compress-Archive -Path "$Stage/*" -DestinationPath "build/QuotaHush-Windows-x64-$Version.zip"
      - name: Package client extensions
        shell: pwsh
        run: |
          $Version = (Get-Content VERSION -Raw).Trim()
          npm run build
          Push-Location vscode-extension
          npx --yes @vscode/vsce package --out "../build/quotahush-vscode-$Version.vsix"
          Pop-Location
          Compress-Archive -Path "extension/*" -DestinationPath "build/quotahush-chromium-$Version.zip"
      - name: Generate release checksums
        shell: pwsh
        run: |
          $ReleaseFiles = Get-ChildItem build -File |
            Where-Object { $_.Name -match '^(QuotaHush-Setup-x64-.+\.exe|QuotaHush-Windows-x64-.+\.zip|quotahush-vscode-.+\.vsix|quotahush-chromium-.+\.zip)$' } |
            Sort-Object Name
          $Checksums = $ReleaseFiles | ForEach-Object {
            $Hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$Hash  $($_.Name)"
          }
          Set-Content -LiteralPath build/SHA256SUMS.txt -Value $Checksums -Encoding utf8
      - name: Attest release provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: |
            build/QuotaHush-Setup-x64-*.exe
            build/QuotaHush-Windows-x64-*.zip
            build/quotahush-vscode-*.vsix
            build/quotahush-chromium-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QuotaHush-release-assets
          path: |
            build/QuotaHush-Setup-x64-*.exe
            build/QuotaHush-Windows-x64-*.zip
            build/quotahush-vscode-*.vsix
            build/quotahush-chromium-*.zip
            build/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Assets = Get-ChildItem build -File |
            Where-Object { $_.Name -match '^(QuotaHush-Setup-x64-.+\.exe|QuotaHush-Windows-x64-.+\.zip|quotahush-vscode-.+\.vsix|quotahush-chromium-.+\.zip|SHA256SUMS\.txt)$' } |
            Select-Object -ExpandProperty FullName
          gh release create $env:GITHUB_REF_NAME $Assets --generate-notes
