[project]
name = "quotahush-server"
version = "0.1.3"
description = "Local helper serving Claude Code, Codex, DeepSeek, and Z.AI usage data to QuotaHush clients"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
quotahush-server = "quotahush_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotahush_server"]
